[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "netsip"
version = "1.1.6"

description = "Python SDK for NetSIPCore SIP engine"

readme = "README.md"

license = "MIT"

requires-python = ">=3.10"

authors = [
    {name = "WildRogerr"}
]


classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]


dependencies = []


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
netsip = [
    "NetSIPCore.exe",
    "NetSIPCore",
    "resources/*.wav"
]